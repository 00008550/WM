<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="16" height="16" role="img" aria-label="WM">
  <!-- Favicon / small-size variant. At 16-24px the third ring in wm-mark.svg
       falls below one device pixel and disappears, so it is dropped and the
       remaining shapes are fattened. Same idea, drawn for the size it runs at.
       Use this at <= 24px; use wm-mark.svg everywhere else. -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="currentColor" stroke-width="5" opacity="0.45"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="currentColor" stroke-width="7"/>
  <circle cx="32" cy="32" r="7"  fill="currentColor"/>
</svg>
