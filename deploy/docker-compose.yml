# DEVELOPMENT infrastructure only — the API, worker and portal run on the host
# (dotnet run / ng serve) for hot reload and debugging.
#
#   docker compose up -d        full stack, matching production
#
# Kafka and RabbitMQ run in development too, deliberately: the punch flow
# publishes to Kafka, so leaving it out of dev would mean never exercising the
# path we actually ship. Dev/prod parity is what caught the startup bugs found
# while containerising.
#
# Container memory is bounded below and WSL2 is capped in ~/.wslconfig. Without
# that cap WSL2 takes most of the machine's RAM and never returns it, which is
# what makes a 16GB dev box freeze — not the brokers themselves.
#
# If you genuinely need the RAM back for a while:
#   docker compose stop kafka rabbitmq
# The app degrades gracefully — IEventStreamProducer no-ops without Kafka and no
# request ever fails because a broker is missing.
#
# The project name is deliberately different from prod so the two never share
# volumes: they initialise Postgres with different passwords, and a shared
# volume silently keeps whichever ran first.
name: wm-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wm
      POSTGRES_USER: wm
      POSTGRES_PASSWORD: wm_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    mem_limit: 400m
    environment:
      RABBITMQ_DEFAULT_USER: wm
      RABBITMQ_DEFAULT_PASS: wm_dev_password
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    mem_limit: 1g
    environment:
      # Dev heap. Production leaves this to the image default.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Dev retention is deliberately tiny — 2 days / 512MB. The long
      # recalculation window (400 days / 20GB) belongs in prod, not on a laptop.
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    ports:
      - "9092:9092"
    volumes:
      # Keep the log off the OS disk so a runaway topic cannot take down the host.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  kafka-data:
